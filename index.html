<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHAMBER // ARCADE</title>
<meta name="theme-color" content="#050505">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%23050505' stroke='%2339ff14' stroke-width='5'/%3E%3Ccircle cx='32' cy='14' r='6' fill='%23ff2222'/%3E%3C/svg%3E">
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #050505;
  color: #39ff14;
  font-family: 'Share Tech Mono', monospace;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow-x: hidden;
  position: relative;
  padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}
body::before {
  content: "";
  position: fixed; inset: 0;
  background: repeating-linear-gradient(0deg, rgba(0,0,0,.18), rgba(0,0,0,.18) 1px, transparent 1px, transparent 2px);
  pointer-events: none; z-index: 100;
}
.container { z-index: 1; text-align: center; max-width: 520px; width: 100%; padding: 1rem; }
h1 { font-size: 2.8rem; letter-spacing: 6px; text-shadow: 0 0 12px #39ff14; margin-bottom: .25rem; }
.sub { opacity: .6; margin-bottom: 2rem; letter-spacing: 2px; }
.menu, .game { display: none; }
.menu.active, .game.active { display: block; }
.modes { display: flex; flex-direction: column; gap: .75rem; margin: 1.5rem 0; }
button {
  background: transparent;
  border: 2px solid #39ff14;
  color: #39ff14;
  padding: 14px 24px;
  font-family: inherit;
  font-size: 1.05rem;
  letter-spacing: 2px;
  cursor: pointer;
  text-transform: uppercase;
  transition: .15s;
  box-shadow: 0 0 10px rgba(57,255,20,.3);
}
button:hover:not(:disabled) { background: #39ff14; color: #000; box-shadow: 0 0 20px #39ff14; }
button:disabled { opacity: .35; cursor: not-allowed; }
.cylinder-wrap { margin: 1.5rem auto; width: 200px; height: 200px; position: relative; }
.cylinder {
  width: 100%; height: 100%; border-radius: 50%;
  border: 4px solid #39ff14;
  background: radial-gradient(circle, #111 40%, #000 70%);
  box-shadow: 0 0 24px #39ff14, inset 0 0 30px rgba(57,255,20,.25);
  position: relative;
  transition: transform .7s cubic-bezier(.4,0,.2,1);
}
.chamber {
  position: absolute; width: 32px; height: 32px; border-radius: 50%;
  border: 2px solid #39ff14; background: #0a0a0a;
  display: flex; align-items: center; justify-content: center; font-size: .8rem;
}
.chamber.current { box-shadow: 0 0 12px #fff, inset 0 0 6px #39ff14; border-color: #fff; }
.chamber.bullet { background: #ff2222; box-shadow: 0 0 14px #ff2222; }
.chamber:nth-child(1) { top: 18px; left: 84px; }
.chamber:nth-child(2) { top: 48px; left: 140px; }
.chamber:nth-child(3) { top: 112px; left: 140px; }
.chamber:nth-child(4) { top: 142px; left: 84px; }
.chamber:nth-child(5) { top: 112px; left: 28px; }
.chamber:nth-child(6) { top: 48px; left: 28px; }
.status { font-size: 1.3rem; min-height: 2.2rem; margin: 1rem 0; text-shadow: 0 0 8px #39ff14; }
.status.bang { color: #ff3333; text-shadow: 0 0 18px #ff3333; animation: flash .25s 3; }
@keyframes flash { 50% { opacity: .2; } }
.stats { display: flex; justify-content: space-around; margin: 1rem 0; opacity: .85; }
.controls { display: flex; gap: .75rem; justify-content: center; flex-wrap: wrap; margin-top: 1rem; }
.high { margin-top: 1.5rem; font-size: .9rem; opacity: .7; }
.disclaimer { margin-top: 2rem; font-size: .65rem; opacity: .4; max-width: 400px; }
.record { margin-top: .4rem; font-size: .8rem; opacity: .6; letter-spacing: 1px; }
.topbar { position: fixed; top: 10px; right: 10px; z-index: 101; }
.topbar button { padding: 6px 10px; font-size: .8rem; box-shadow: none; }
.turn { font-size: .85rem; opacity: .75; letter-spacing: 2px; min-height: 1.2rem; }
.turn.ai { color: #ffcc33; text-shadow: 0 0 8px #ffcc33; opacity: 1; }
@media (max-width: 420px) { h1 { font-size: 2.3rem; letter-spacing: 4px; } button { padding: 12px 16px; font-size: .95rem; } }
.spinning { animation: spin .65s linear; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="topbar"><button id="muteBtn" onclick="toggleMute()" aria-label="Sound on or off">SOUND: ON</button></div>
<div class="container">
  <h1>CHAMBER</h1>
  <div class="sub">// ARCADE ROULETTE //</div>

  <div class="menu active" id="menu">
    <div class="modes">
      <button onclick="start('fair')">FAIR MODE (always 1/6)</button>
      <button onclick="start('classic')">CLASSIC (odds rise)</button>
      <button onclick="start('ai')">VS AI</button>
    </div>
    <div class="high">BEST STREAK — FAIR: <strong id="bestFair">0</strong> · CLASSIC: <strong id="bestClassic">0</strong></div>
    <div class="record">VS AI RECORD: <strong id="aiRec">0-0</strong></div>
  </div>

  <div class="game" id="game">
    <div class="cylinder-wrap">
      <div class="cylinder" id="cyl">
        <div class="chamber" data-i="0"></div>
        <div class="chamber" data-i="1"></div>
        <div class="chamber" data-i="2"></div>
        <div class="chamber" data-i="3"></div>
        <div class="chamber" data-i="4"></div>
        <div class="chamber" data-i="5"></div>
      </div>
    </div>
    <div class="turn" id="turn"></div>
    <div class="status" id="status">READY</div>
    <div class="stats">
      <span>SURVIVED: <strong id="surv">0</strong></span>
      <span id="oddsLabel">ODDS: 1/6</span>
    </div>
    <div class="controls">
      <button id="spinBtn" onclick="spin()">SPIN</button>
      <button id="fireBtn" onclick="fire()" disabled>PULL</button>
      <button id="againBtn" onclick="again()" style="display:none">PLAY AGAIN</button>
      <button id="menuBtn" onclick="menu()">MENU</button>
    </div>
  </div>

  <div class="disclaimer">SIMULATION ONLY — NO REAL FIREARMS. FOR FUN.</div>
</div>

<script>
// Modes:
//  fair    - re-spin before every pull, always 1/6. Score = safe pulls in a row.
//  classic - one spin, chamber advances, odds rise 1/6 -> 1/1. Score = safe pulls.
//  ai      - one spin, shared cylinder, you and the AI take turns pulling.
//            The chamber advances each pull, so odds rise. First to hit loses.
let mode = 'fair';
let bullet = -1;
let current = 0;
let survived = 0;   // safe pulls this round (yours only in VS AI)
let pulls = 0;      // pulls since the last spin (sets the odds)
let spun = false;
let over = false;
let aiTurn = false;
let busy = false;   // true while the AI is acting, locks your buttons
let timers = [];

const $ = (id) => document.getElementById(id);
const menuEl = $('menu'), gameEl = $('game'), status = $('status'), turnEl = $('turn');
const survEl = $('surv'), oddsLabel = $('oddsLabel');
const spinBtn = $('spinBtn'), fireBtn = $('fireBtn'), againBtn = $('againBtn'), menuBtn = $('menuBtn');
const cyl = $('cyl');
const chambers = document.querySelectorAll('.chamber');

function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
function num(k) { return parseInt(store(k) || '0', 10) || 0; }

// Old saves had one shared best; keep it as the fair best.
if (store('chamberBest') && !store('chamberBest_fair')) store('chamberBest_fair', store('chamberBest'));

function loadBest() {
  $('bestFair').textContent = num('chamberBest_fair');
  $('bestClassic').textContent = num('chamberBest_classic');
  $('aiRec').textContent = num('chamberAiWins') + '-' + num('chamberAiLosses');
}
loadBest();

function later(fn, ms) { timers.push(setTimeout(fn, ms)); }
function clearTimers() { timers.forEach(clearTimeout); timers = []; }

function start(m) {
  mode = m;
  menuEl.classList.remove('active');
  gameEl.classList.add('active');
  resetRound();
}

function menu() {
  clearTimers();
  gameEl.classList.remove('active');
  menuEl.classList.add('active');
  loadBest();
}

function again() { resetRound(); }

function resetRound() {
  clearTimers();
  bullet = -1; current = 0; survived = 0; pulls = 0;
  spun = false; over = false; aiTurn = false; busy = false;
  survEl.textContent = '0';
  status.classList.remove('bang');
  status.textContent = mode === 'ai' ? 'SPIN TO LOAD — YOU PULL FIRST' : 'SPIN THE CYLINDER';
  againBtn.style.display = 'none';
  updateOdds(); updateChambers(false); refresh();
}

function refresh() {
  const yourMove = !over && !busy && !(mode === 'ai' && aiTurn);
  spinBtn.disabled = !yourMove || spun;
  fireBtn.disabled = !yourMove || !spun;
  spinBtn.style.display = over ? 'none' : '';
  fireBtn.style.display = over ? 'none' : '';
  againBtn.style.display = over ? '' : 'none';
  if (mode === 'ai' && !over) {
    turnEl.textContent = aiTurn ? 'AI TURN' : (spun ? 'YOUR TURN' : '');
    turnEl.classList.toggle('ai', aiTurn);
  } else { turnEl.textContent = ''; turnEl.classList.remove('ai'); }
}

function updateOdds() {
  const left = mode === 'fair' ? 6 : Math.max(1, 6 - pulls);
  oddsLabel.textContent = 'ODDS: 1/' + left;
}

function updateChambers(reveal) {
  chambers.forEach((el, i) => {
    el.classList.remove('bullet', 'current');
    el.textContent = '';
    if (reveal && i === bullet) { el.classList.add('bullet'); el.textContent = '•'; }
    if (spun && !over && i === current) el.classList.add('current');
  });
}

function spin() {
  if (over || spun || busy) return;
  cyl.classList.remove('spinning'); void cyl.offsetWidth; cyl.classList.add('spinning');
  later(() => cyl.classList.remove('spinning'), 650);
  bullet = Math.floor(Math.random() * 6); // fresh load every spin
  current = Math.floor(Math.random() * 6);
  spun = true; pulls = 0;
  sfx.spin();
  status.textContent = 'READY — PULL';
  updateOdds(); updateChambers(false); refresh();
}

function fire() {
  if (!spun || over) return;
  if (busy && !aiTurn) return;
  const byAi = mode === 'ai' && aiTurn;
  const hit = current === bullet;
  pulls++;
  if (hit) {
    over = true; busy = false;
    status.classList.add('bang');
    updateChambers(true);
    sfx.bang();
    if (navigator.vibrate) { try { navigator.vibrate([60, 40, 120]); } catch (e) {} }
    if (mode === 'ai') {
      if (byAi) { status.textContent = 'AI HIT — YOU WIN'; store('chamberAiWins', num('chamberAiWins') + 1); }
      else { status.textContent = 'BANG — AI WINS'; store('chamberAiLosses', num('chamberAiLosses') + 1); }
    } else {
      status.textContent = 'BANG — OUT AT ' + survived;
      const key = 'chamberBest_' + mode;
      if (survived > num(key)) { store(key, survived); status.textContent = 'BANG — NEW BEST: ' + survived; }
    }
    aiTurn = false;
    refresh();
    return;
  }
  sfx.click();
  if (!byAi) { survived++; survEl.textContent = survived; }
  current = (current + 1) % 6;
  if (mode === 'fair') {
    spun = false; // re-spin before every pull
    status.textContent = 'CLICK — SAFE. SPIN AGAIN';
  } else if (mode === 'classic') {
    status.textContent = 'CLICK — SAFE';
  } else if (!byAi) {
    status.textContent = 'CLICK — SAFE. AI TURN';
    aiTurn = true; busy = true;
    later(() => { status.textContent = 'AI PULLS...'; }, 500);
    later(() => fire(), 1300);
  } else {
    status.textContent = 'AI CLICK — YOUR TURN';
    aiTurn = false; busy = false;
  }
  updateOdds(); updateChambers(false); refresh();
}

// ---- sound: one shared audio context, with a mute switch ----
const sfx = (function () {
  let ac = null;
  let muted = store('chamberMuted') === '1';
  function ctx() {
    if (muted) return null;
    try {
      if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === 'suspended') ac.resume();
    } catch (e) { ac = null; }
    return ac;
  }
  function tone(f0, f1, dur, vol, type) {
    const c = ctx(); if (!c) return;
    const t = c.currentTime, o = c.createOscillator(), g = c.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(f0, t);
    if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.02);
  }
  function noise(dur, vol) {
    const c = ctx(); if (!c) return;
    const n = Math.floor(c.sampleRate * dur), b = c.createBuffer(1, n, c.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2);
    const s = c.createBufferSource(), g = c.createGain(); s.buffer = b; g.gain.value = vol;
    s.connect(g); g.connect(c.destination); s.start();
  }
  return {
    get muted() { return muted; },
    setMuted(m) { muted = m; store('chamberMuted', m ? '1' : '0'); },
    click() { tone(900, null, 0.07, 0.12, 'square'); },
    spin() { for (let i = 0; i < 6; i++) setTimeout(() => tone(1400, null, 0.03, 0.05, 'square'), i * 90); },
    bang() { noise(0.5, 0.5); tone(70, 30, 0.45, 0.5); },
  };
})();

function paintMute() { $('muteBtn').textContent = 'SOUND: ' + (sfx.muted ? 'OFF' : 'ON'); }
function toggleMute() { sfx.setMuted(!sfx.muted); paintMute(); if (!sfx.muted) sfx.click(); }
paintMute();

document.addEventListener('keydown', (e) => {
  if (!gameEl.classList.contains('active')) return;
  if (e.code === 'Space' || e.code === 'Enter') {
    e.preventDefault();
    if (over) again(); else if (!spinBtn.disabled) spin(); else if (!fireBtn.disabled) fire();
  } else if (e.code === 'Escape') menu();
});

// test hook
window.__chamber = { state: () => ({ mode, bullet, current, survived, pulls, spun, over, aiTurn, busy }) };
</script>
</body>
</html>
