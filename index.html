<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHAMBER // ARCADE</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #050505;
  color: #39ff14;
  font-family: 'Share Tech Mono', monospace;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
}
body::before {
  content: "";
  position: fixed; inset: 0;
  background: repeating-linear-gradient(0deg, rgba(0,0,0,.18), rgba(0,0,0,.18) 1px, transparent 1px, transparent 2px);
  pointer-events: none; z-index: 100;
}
.container { z-index: 1; text-align: center; max-width: 520px; width: 100%; padding: 1rem; }
h1 { font-size: 2.8rem; letter-spacing: 6px; text-shadow: 0 0 12px #39ff14; margin-bottom: .25rem; }
.sub { opacity: .6; margin-bottom: 2rem; letter-spacing: 2px; }
.menu, .game { display: none; }
.menu.active, .game.active { display: block; }
.modes { display: flex; flex-direction: column; gap: .75rem; margin: 1.5rem 0; }
button {
  background: transparent;
  border: 2px solid #39ff14;
  color: #39ff14;
  padding: 14px 24px;
  font-family: inherit;
  font-size: 1.05rem;
  letter-spacing: 2px;
  cursor: pointer;
  text-transform: uppercase;
  transition: .15s;
  box-shadow: 0 0 10px rgba(57,255,20,.3);
}
button:hover:not(:disabled) { background: #39ff14; color: #000; box-shadow: 0 0 20px #39ff14; }
button:disabled { opacity: .35; cursor: not-allowed; }
.cylinder-wrap { margin: 1.5rem auto; width: 200px; height: 200px; position: relative; }
.cylinder {
  width: 100%; height: 100%; border-radius: 50%;
  border: 4px solid #39ff14;
  background: radial-gradient(circle, #111 40%, #000 70%);
  box-shadow: 0 0 24px #39ff14, inset 0 0 30px rgba(57,255,20,.25);
  position: relative;
  transition: transform .7s cubic-bezier(.4,0,.2,1);
}
.chamber {
  position: absolute; width: 32px; height: 32px; border-radius: 50%;
  border: 2px solid #39ff14; background: #0a0a0a;
  display: flex; align-items: center; justify-content: center; font-size: .8rem;
}
.chamber.current { box-shadow: 0 0 12px #fff, inset 0 0 6px #39ff14; border-color: #fff; }
.chamber.bullet { background: #ff2222; box-shadow: 0 0 14px #ff2222; }
.chamber:nth-child(1) { top: 18px; left: 84px; }
.chamber:nth-child(2) { top: 48px; left: 140px; }
.chamber:nth-child(3) { top: 112px; left: 140px; }
.chamber:nth-child(4) { top: 142px; left: 84px; }
.chamber:nth-child(5) { top: 112px; left: 28px; }
.chamber:nth-child(6) { top: 48px; left: 28px; }
.status { font-size: 1.3rem; min-height: 2.2rem; margin: 1rem 0; text-shadow: 0 0 8px #39ff14; }
.status.bang { color: #ff3333; text-shadow: 0 0 18px #ff3333; animation: flash .25s 3; }
@keyframes flash { 50% { opacity: .2; } }
.stats { display: flex; justify-content: space-around; margin: 1rem 0; opacity: .85; }
.controls { display: flex; gap: .75rem; justify-content: center; flex-wrap: wrap; margin-top: 1rem; }
.high { margin-top: 1.5rem; font-size: .9rem; opacity: .7; }
.disclaimer { margin-top: 2rem; font-size: .65rem; opacity: .4; max-width: 400px; }
.spinning { animation: spin .65s linear; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="container">
  <h1>CHAMBER</h1>
  <div class="sub">// ARCADE ROULETTE //</div>

  <div class="menu active" id="menu">
    <div class="modes">
      <button onclick="start('fair')">FAIR MODE (always 1/6)</button>
      <button onclick="start('classic')">CLASSIC (odds rise)</button>
      <button onclick="start('ai')">VS AI</button>
    </div>
    <div class="high">BEST SURVIVAL: <strong id="best">0</strong></div>
  </div>

  <div class="game" id="game">
    <div class="cylinder-wrap">
      <div class="cylinder" id="cyl">
        <div class="chamber" data-i="0"></div>
        <div class="chamber" data-i="1"></div>
        <div class="chamber" data-i="2"></div>
        <div class="chamber" data-i="3"></div>
        <div class="chamber" data-i="4"></div>
        <div class="chamber" data-i="5"></div>
      </div>
    </div>
    <div class="status" id="status">READY</div>
    <div class="stats">
      <span>SURVIVED: <strong id="surv">0</strong></span>
      <span id="oddsLabel">ODDS: 1/6</span>
    </div>
    <div class="controls">
      <button id="spinBtn" onclick="spin()">SPIN</button>
      <button id="fireBtn" onclick="fire()" disabled>PULL</button>
      <button onclick="menu()">MENU</button>
    </div>
  </div>

  <div class="disclaimer">SIMULATION ONLY — NO REAL FIREARMS. FOR FUN.</div>
</div>

<script>
let mode = 'fair';
let bullet = -1;
let current = 0;
let survived = 0;
let spun = false;
let over = false;
let aiTurn = false;

const menuEl = document.getElementById('menu');
const gameEl = document.getElementById('game');
const status = document.getElementById('status');
const survEl = document.getElementById('surv');
const oddsLabel = document.getElementById('oddsLabel');
const spinBtn = document.getElementById('spinBtn');
const fireBtn = document.getElementById('fireBtn');
const cyl = document.getElementById('cyl');
const chambers = document.querySelectorAll('.chamber');
const bestEl = document.getElementById('best');

function loadBest() {
  bestEl.textContent = localStorage.getItem('chamberBest') || '0';
}
loadBest();

function start(m) {
  mode = m;
  menuEl.classList.remove('active');
  gameEl.classList.add('active');
  resetRound();
  status.textContent = mode === 'ai' ? 'YOUR TURN — SPIN' : 'SPIN THE CYLINDER';
}

function menu() {
  gameEl.classList.remove('active');
  menuEl.classList.add('active');
  loadBest();
}

function resetRound() {
  bullet = -1;
  current = 0;
  survived = 0;
  spun = false;
  over = false;
  aiTurn = false;
  survEl.textContent = '0';
  updateOdds();
  updateChambers(false);
  fireBtn.disabled = true;
  spinBtn.disabled = false;
  status.classList.remove('bang');
}

function updateOdds() {
  if (mode === 'fair') oddsLabel.textContent = 'ODDS: 1/6';
  else oddsLabel.textContent = `ODDS: 1/${Math.max(1, 6 - survived)}`;
}

function updateChambers(reveal) {
  chambers.forEach((el, i) => {
    el.classList.remove('bullet', 'current');
    el.textContent = '';
    if (reveal && i === bullet) {
      el.classList.add('bullet');
      el.textContent = '•';
    }
    if (spun && !over && i === current) el.classList.add('current');
  });
}

function spin() {
  if (over) return;
  cyl.classList.add('spinning');
  setTimeout(() => cyl.classList.remove('spinning'), 650);
  bullet = Math.floor(Math.random() * 6);
  current = Math.floor(Math.random() * 6);
  spun = true;
  status.textContent = mode === 'ai' && aiTurn ? 'AI SPINNING...' : 'READY — PULL';
  fireBtn.disabled = false;
  spinBtn.disabled = true;
  updateChambers(false);
  if (mode === 'ai' && aiTurn) setTimeout(fire, 800);
}

function fire() {
  if (!spun || over) return;
  const hit = current === bullet;
  if (hit) {
    over = true;
    status.textContent = mode === 'ai' && aiTurn ? 'AI HIT — YOU WIN' : 'BANG — DEAD';
    status.classList.add('bang');
    updateChambers(true);
    play(true);
    if (survived > (parseInt(localStorage.getItem('chamberBest') || '0'))) {
      localStorage.setItem('chamberBest', survived);
    }
    fireBtn.disabled = true;
    spinBtn.disabled = false;
  } else {
    survived++;
    survEl.textContent = survived;
    status.textContent = mode === 'ai' && aiTurn ? 'AI CLICK — YOUR TURN' : 'CLICK — SAFE';
    play(false);
    if (mode === 'fair') {
      spun = false;
      spinBtn.disabled = false;
      fireBtn.disabled = true;
      current = Math.floor(Math.random() * 6);
    } else {
      current = (current + 1) % 6;
    }
    updateOdds();
    updateChambers(false);
    if (mode === 'ai' && !aiTurn) {
      aiTurn = true;
      setTimeout(() => { spinBtn.disabled = false; spin(); }, 900);
    } else if (mode === 'ai') {
      aiTurn = false;
      spinBtn.disabled = false;
      fireBtn.disabled = true;
    }
  }
}

function play(bang) {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const o = ctx.createOscillator();
  const g = ctx.createGain();
  o.connect(g); g.connect(ctx.destination);
  if (bang) {
    o.frequency.setValueAtTime(70, ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(30, ctx.currentTime + .35);
    g.gain.setValueAtTime(.5, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(.01, ctx.currentTime + .45);
    o.start(); o.stop(ctx.currentTime + .45);
  } else {
    o.frequency.setValueAtTime(900, ctx.currentTime);
    g.gain.setValueAtTime(.12, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(.01, ctx.currentTime + .07);
    o.start(); o.stop(ctx.currentTime + .07);
  }
}
</script>
</body>
</html>
